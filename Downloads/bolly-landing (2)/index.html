<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bolly — Knock Out Flakes</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page">

    <!-- HERO -->
    <section class="hero" id="hero">

      <header class="nav">
        <div class="logo">bolly</div>

        <nav class="nav-pill" id="navPill">
          <button class="nav-toggle" id="navToggle" aria-label="Menu">
            <span></span><span></span><span></span>
          </button>
          <a href="#shop">Shop <span class="chev">+</span></a>
          <a href="#about">About</a>
          <a href="#blog">Blog</a>
          <a href="#contact">Contact</a>
        </nav>

        <div class="cart">
          <span class="cart-label">Cart</span>
          <span class="cart-icon">🛍</span>
        </div>
      </header>

      <div class="hero-grid">

        <div class="hero-left">
          <div class="badge-row">
            <span class="eyebrow">FROM ROOT</span>
            <span class="pill">TO SHINE</span>
          </div>
          <h1 class="headline">
            KNOCK<br />
            OUT<br />
            FLAKES
          </h1>
        </div>

        <div class="hero-center">
          <!-- 3D bottle mounts here -->
          <div class="bottle-stage" id="bottleStage">
            <div class="bottle-cylinder" id="bottleCylinder"></div>
            <div class="bottle-cap"></div>
            <div class="bottle-pump">
              <div class="pump-head"></div>
              <div class="pump-neck"></div>
              <div class="pump-arm"></div>
            </div>
            <div class="bottle-shadow"></div>
          </div>
          <p class="drag-hint">drag to rotate</p>
        </div>

        <div class="hero-right">
          <p class="tagline">
            Journey in to the <em>wonderful</em> world of shampoo
          </p>
          <a href="#shop" class="explore-btn">
            EXPLORE MORE <span class="arrow">↗</span>
          </a>
        </div>

      </div>

      <div class="hero-bg-arc" aria-hidden="true"></div>
    </section>

  </div>

<script src="script.js"></script>
</body>
</html>
